<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">Meu Controle Financeiro</h1>

        <!-- Formulário de cadastro -->
        <form id="formGasto" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Descrição</label>
                <input type="text" id="descricao" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-emerald-500" placeholder="Ex: Mercado, Lanche...">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-sm font-medium mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-emerald-500" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Tipo</label>
                    <select id="tipo" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-emerald-500">
                        <option value="gasto">Gasto</option>
                        <option value="receita">Receita</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Categoria</label>
                <select id="categoria" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-emerald-500">
                    <option value="Essencial">Essencial (Faculdade/Fixos)</option>
                    <option value="Dívida">Dívida / Empréstimo</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Freela">Renda Extra / Freela</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Data</label>
                <input type="date" id="data" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2 rounded transition">Salvar Transação</button>
        </form>

        <!-- Lista de transações -->
        <div class="mt-8">
            <h2 class="text-lg font-semibold mb-3 border-b border-slate-700 pb-2">Histórico Recente</h2>
            <div id="listaTransacoes" class="space-y-2 max-h-60 overflow-y-auto">
                <!-- Os itens entram aqui via JS -->
            </div>
        </div>
    </div>

    <script>
       const API_URL = 'https://controle-financeiro-v2ol.onrender.com/transacoes';

        // Preencher a data de hoje automaticamente
        document.getElementById('data').valueAsDate = new Date();

        async function carregarTransacoes() {
            try {
                const res = await fetch(API_URL);
                const dados = await res.json();
                const lista = document.getElementById('listaTransacoes');
                lista.innerHTML = '';

                dados.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center bg-slate-900 p-3 rounded border border-slate-700 text-sm";
                    
                    const corValor = item.tipo === 'receita' ? 'text-emerald-400' : 'text-rose-400';
                    const sinal = item.tipo === 'receita' ? '+' : '-';

                    div.innerHTML = `
                        <div>
                            <p class="font-bold">${item.descricao}</p>
                            <span class="text-xs text-slate-400">${item.categoria} • ${item.data}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="${corValor} font-bold">${sinal} R$ ${item.valor.toFixed(2)}</span>
                            <button onclick="deletar(${item.id})" class="text-slate-500 hover:text-rose-400 text-xs">✕</button>
                        </div>
                    `;
                    lista.appendChild(div);
                });
            } catch (e) {
                console.error("Erro ao carregar dados", e);
            }
        }

        document.getElementById('formGasto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value),
                tipo: document.getElementById('tipo').value,
                categoria: document.getElementById('categoria').value,
                data: document.getElementById('data').value
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('descricao').value = '';
            document.getElementById('valor').value = '';
            carregarTransacoes();
        });

        async function deletar(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            carregarTransacoes();
        }

        carregarTransacoes();
    </script>
</body>
</html>
